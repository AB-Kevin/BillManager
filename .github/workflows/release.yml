name: Release

# Builds the Windows (.exe) and macOS (.dmg/.zip) installers and publishes
# them both to the GitHub Release for the pushed tag.
#
# Usage: bump "version" in package.json, commit, then:
#   git tag v1.2.2
#   git push origin v1.2.2
# This can be run from Windows (or anywhere) — GitHub's own macOS runner
# builds the Mac installer, no local Mac required.
#
# windows and mac run one after another (not in parallel): electron-builder's
# --publish step both creates/updates the same GitHub Release for the tag, and
# two jobs doing that at the same time can race and silently drop an asset
# (this bit us once — the Mac job's .dmg and latest-mac.yml never made it into
# a release even though its job reported success). `needs:` below serializes
# them so only one job is ever touching the release at a time.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build & publish (Windows)
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-mac:
    needs: release-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build & publish (macOS)
        run: npm run release:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Mac auto-update assets were actually published
        run: |
          for f in dist/latest-mac.yml dist/*.dmg; do
            if ! ls $f >/dev/null 2>&1; then
              echo "::error::Expected artifact missing: $f (Mac release build produced no such file — check the electron-builder output above)"
              exit 1
            fi
          done
